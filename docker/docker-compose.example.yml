# Minimal Mixer daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change MIXER_PASSWORD first.
services:
  mixer:
    image: ghcr.io/mixer/mixer:latest
    container_name: mixer
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      MIXER_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # MIXER_HOSTNAMES: "mixer.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./mixer-home:/home/mixer
      # Code visible to Mixer and the agents it launches.
      - ./workspace:/workspace
