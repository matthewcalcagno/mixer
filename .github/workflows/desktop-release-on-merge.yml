name: Release merged desktop app

on:
  pull_request:
    branches: [main]
    types: [closed]

# Serialize version allocation and publishing across merges. Do not cancel a release.
concurrency:
  group: desktop-release-on-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare versioned release commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          LEFTHOOK: "0"
        run: node scripts/prepare-merged-desktop-release.mjs
      - name: Push desktop release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          canonical_tag="$(node --input-type=module -e 'import { normalizeReleaseTag } from "./scripts/release-version-utils.mjs"; console.log(normalizeReleaseTag(process.env.RELEASE_TAG));')"
          release_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if git show-ref --verify --quiet "refs/tags/$canonical_tag"; then
            test "$(git rev-parse "$canonical_tag^{commit}")" = "$release_commit"
          else
            git tag "$canonical_tag" "$release_commit"
          fi
          git push --atomic origin "refs/tags/$RELEASE_TAG" "refs/tags/$canonical_tag"

  release:
    needs: version
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
