name: Desktop Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ inputs.tag }}
  CHECKOUT_REF: ${{ inputs.tag }}
  SHOULD_PUBLISH: "true"
  ROLLOUT_HOURS: "36"
  DESKTOP_PACKAGE_PATH: "packages/desktop"

jobs:
  prepare:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
      manifests: ${{ steps.plan.outputs.manifests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Plan and validate desktop release
        id: plan
        env:
          SELECTED_PLATFORM: "macos"
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getDesktopReleasePlan, getReleaseInfoFromSourceTag } from './scripts/release-version-utils.mjs';
          const info = getReleaseInfoFromSourceTag(process.env.SOURCE_TAG);
          const plan = getDesktopReleasePlan(process.env.SOURCE_TAG, process.env.SELECTED_PLATFORM);
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const file of ['package.json', ...root.workspaces.map((name) => `${name}/package.json`)]) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (pkg.version !== info.version) throw new Error(`${file}: ${pkg.version} does not match release ${info.version}`);
          }
          const configuredRepo = new URL(root.repository.url).pathname.slice(1).replace(/\.git$/, '');
          if (process.env.SHOULD_PUBLISH === 'true' && configuredRepo.toLowerCase() !== process.env.GITHUB_REPOSITORY.toLowerCase()) {
            throw new Error(`Release repository must match package.json: ${configuredRepo}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `platforms=${JSON.stringify(plan.platforms)}\nmanifests=${JSON.stringify(plan.manifestNames)}\n`);
          NODE

  quality:
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Check release source
        run: npm run release:check
      - name: Verify release metadata contracts
        run: |
          node --test scripts/release-version-utils.test.mjs
          npx vitest run scripts/merge-mac-manifest.test.mjs scripts/validate-desktop-manifests.test.mjs --bail=1

  create-release:
    needs: [prepare, quality]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping creation"
          else
            prerelease_flag=""
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "$(git rev-parse HEAD)" \
              --title "Mixer $RELEASE_TAG" \
              --generate-notes \
              --draft \
              $prerelease_flag || {
                echo "Release creation raced with another workflow; continuing."
                node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" > /dev/null
              }
          fi

      - name: Sync release notes from changelog
        if: env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-release-notes-from-changelog.mjs --tag "$RELEASE_TAG" --repo "${{ github.repository }}"

  publish-macos:
    needs: [prepare, quality, create-release]
    if: ${{ always() && needs.quality.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && contains(fromJSON(needs.prepare.outputs.platforms || '[]'), 'macos') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            electron_arch: arm64
            node_heap_mb: 4096
          - runner: macos-15-intel
            electron_arch: x64
            node_heap_mb: 8192
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Validate macOS signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for secret_name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing Actions secret: $secret_name"
              exit 1
            fi
          done

      - name: Build desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MIXER_DESKTOP_SMOKE: "1"
          MIXER_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          # Metro's jest workers OOM on the generated ws-outbound.aot.js validator,
          # the last module in the web bundle. Node's default heap is sized from
          # runner RAM, which is not enough on the Intel runner.
          NODE_OPTIONS: --max-old-space-size=${{ matrix.node_heap_mb }}
        run: |
          set -euo pipefail
          export MIXER_REAL_XCRUN="$(command -v xcrun)"
          stapler_bin="$(mktemp -d)"
          trap 'rm -rf "$stapler_bin"' EXIT
          cat > "$stapler_bin/xcrun" <<'STAPLER'
          #!/bin/bash
          if [[ "${1:-}" != stapler || "${2:-}" != staple ]]; then
            exec "$MIXER_REAL_XCRUN" "$@"
          fi
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          for attempt in 1 2 3 4; do
            if "$MIXER_REAL_XCRUN" "$@" >"$output" 2>&1; then
              cat "$output"
              exit 0
            else
              status=$?
            fi
            cat "$output"
            if [[ "$status" != 68 || "$attempt" == 4 ]] ||
              ! grep -Fq 'NSURLErrorDomain Code=-1005' "$output"; then
              exit "$status"
            fi
            echo "::warning::Apple staple connection lost; retrying the same signed app ($attempt/4)" >&2
            sleep 30
          done
          STAPLER
          chmod +x "$stapler_bin/xcrun"
          export PATH="$stapler_bin:$PATH"
          build_args=(-- --publish never --mac --${{ matrix.electron_arch }} -c.forceCodeSigning=true)
          build_args+=("-c.publish.releaseType=$RELEASE_TYPE")
          build_args+=("-c.publish.channel=$RELEASE_CHANNEL")
          npm run build:desktop "${build_args[@]}"

      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-macos-${{ matrix.electron_arch }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload desktop artifacts to release
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")"
          node scripts/upload-release-assets.mjs "$release_lookup" "$release_dir" "${{ github.repository }}"

      - name: Upload desktop artifacts to workflow
        if: env.SHOULD_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.electron_arch }}
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/*.dmg
          retention-days: 7

      - name: Upload manifest artifact
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mac-manifest-${{ matrix.electron_arch }}
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/${{ env.RELEASE_CHANNEL }}-mac.yml
          retention-days: 1

  publish-linux:
    needs: [prepare, quality, create-release]
    if: ${{ always() && needs.quality.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && contains(fromJSON(needs.prepare.outputs.platforms || '[]'), 'linux') }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          MIXER_DESKTOP_SMOKE: "1"
          MIXER_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          set -euo pipefail
          build_args=(-- --publish never --linux --x64)
          build_args+=("-c.publish.releaseType=$RELEASE_TYPE")
          build_args+=("-c.publish.channel=$RELEASE_CHANNEL")
          npm run build:desktop "${build_args[@]}"

      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload desktop artifacts to release
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")"
          node scripts/upload-release-assets.mjs "$release_lookup" "$release_dir" "${{ github.repository }}"

      - name: Upload desktop artifacts to workflow
        if: env.SHOULD_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/*
          retention-days: 7

      - name: Upload manifest artifact
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-manifest
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/${{ env.RELEASE_CHANNEL }}-linux.yml
          retention-days: 1

  publish-windows:
    needs: [prepare, quality, create-release]
    if: ${{ always() && needs.quality.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') && contains(fromJSON(needs.prepare.outputs.platforms || '[]'), 'windows') }}
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release metadata
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          MIXER_DESKTOP_SMOKE: "1"
          MIXER_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          set -euo pipefail
          build_args=(-- --publish never --win --x64 --arm64)
          build_args+=("-c.publish.releaseType=$RELEASE_TYPE")
          build_args+=("-c.publish.channel=$RELEASE_CHANNEL")
          npm run build:desktop "${build_args[@]}"

      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-windows-x64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload desktop artifacts to release
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${DESKTOP_PACKAGE_PATH}/release"
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")"
          node scripts/upload-release-assets.mjs "$release_lookup" "$release_dir" "${{ github.repository }}"

      - name: Upload desktop artifacts to workflow
        if: env.SHOULD_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/*
          retention-days: 7

      - name: Upload manifest artifact
        if: env.SHOULD_PUBLISH == 'true' && env.IS_SMOKE_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-manifest
          path: ${{ env.DESKTOP_PACKAGE_PATH }}/release/${{ env.RELEASE_CHANNEL }}.yml
          retention-days: 1

  finalize-rollout:
    needs: [prepare, create-release, publish-macos, publish-linux, publish-windows]
    if: ${{ always() && needs.prepare.result == 'success' && needs.create-release.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-rollout-${{ inputs.tag }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            package-lock.json
            scripts
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Download mac manifest artifacts
        if: env.IS_SMOKE_TAG != 'true' && needs.publish-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: mac-manifest-*
          path: release-manifests

      - name: Download Linux manifest artifact
        if: env.IS_SMOKE_TAG != 'true' && needs.publish-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-manifest
          path: release-manifests/linux-manifest

      - name: Download Windows manifest artifact
        if: env.IS_SMOKE_TAG != 'true' && needs.publish-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-manifest
          path: release-manifests/windows-manifest

      - name: Assemble manifests and publish release
        if: env.IS_SMOKE_TAG != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_MANIFESTS: ${{ needs.prepare.outputs.manifests }}
          MACOS_RESULT: ${{ needs.publish-macos.result }}
          LINUX_RESULT: ${{ needs.publish-linux.result }}
          WINDOWS_RESULT: ${{ needs.publish-windows.result }}
        shell: bash
        run: |
          set -euo pipefail
          for platform_result in "$MACOS_RESULT" "$LINUX_RESULT" "$WINDOWS_RESULT"; do
            if [[ ! "$platform_result" =~ ^(success|skipped)$ ]]; then
              echo "::error::A desktop build failed; the release remains a draft"
              exit 1
            fi
          done
          mkdir -p release-manifests
          cd release-manifests
          manifests_dir="$PWD/final"
          mkdir -p "$manifests_dir"

          manifest_names="$(node -e 'console.log(JSON.parse(process.env.EXPECTED_MANIFESTS).join("\n"))')"
          mapfile -t expected_manifests <<< "$manifest_names"
          release_lookup="$(node ../scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" --cleanup-duplicates)"
          existing_assets="$(gh release view "$release_lookup" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          for manifest_name in "${expected_manifests[@]}"; do
            if grep -Fxq "$manifest_name" <<< "$existing_assets"; then
              case "$manifest_name" in
                "${RELEASE_CHANNEL}-mac.yml") platform_result="${{ needs.publish-macos.result }}" ;;
                "${RELEASE_CHANNEL}-linux.yml") platform_result="${{ needs.publish-linux.result }}" ;;
                "${RELEASE_CHANNEL}.yml") platform_result="${{ needs.publish-windows.result }}" ;;
              esac
              if [[ "$platform_result" =~ ^(success|skipped)$ ]]; then
                gh release download "$release_lookup" \
                  --repo "${{ github.repository }}" \
                  --pattern "$manifest_name" \
                  --dir "$manifests_dir"
              else
                gh release delete-asset "$release_lookup" "$manifest_name" \
                  --repo "${{ github.repository }}" \
                  --yes
              fi
            fi
          done

          if [[ "${{ needs.publish-macos.result }}" == "success" ]]; then
            manifest_name="${RELEASE_CHANNEL}-mac.yml"
            node ../scripts/merge-mac-manifest.mjs \
              "mac-manifest-arm64/${manifest_name}" \
              "mac-manifest-x64/${manifest_name}" \
              "$manifests_dir/${manifest_name}"
          fi

          if [[ "${{ needs.publish-linux.result }}" == "success" ]]; then
            cp "linux-manifest/${RELEASE_CHANNEL}-linux.yml" "$manifests_dir/"
          fi

          if [[ "${{ needs.publish-windows.result }}" == "success" ]]; then
            cp "windows-manifest/${RELEASE_CHANNEL}.yml" "$manifests_dir/"
          fi

          shopt -s nullglob
          files=( "$manifests_dir"/*.yml )
          if (( ${#files[@]} == 0 )); then
            echo "::error::No manifest artifacts were available to publish"
            exit 1
          fi
          missing_manifests=()
          for manifest_name in "${expected_manifests[@]}"; do
            [[ -f "$manifests_dir/$manifest_name" ]] || missing_manifests+=("$manifest_name")
          done
          if (( ${#missing_manifests[@]} > 0 )); then
            echo "::error::Missing updater manifests: ${missing_manifests[*]}; the release remains a draft"
            exit 1
          fi

          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
          node ../scripts/stamp-rollout.mjs --release-date "$timestamp" --rollout-hours "$ROLLOUT_HOURS" "${files[@]}"
          node ../scripts/validate-desktop-manifests.mjs \
            --release-date "$timestamp" \
            --rollout-hours "$ROLLOUT_HOURS" \
            "${files[@]}"
          gh release upload "$release_lookup" "${files[@]}" --clobber --repo "${{ github.repository }}"

          publish_args=(release edit "$release_lookup" --tag "$RELEASE_TAG" --draft=false --repo "${{ github.repository }}")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            publish_args+=(--prerelease)
          fi
          gh "${publish_args[@]}"
