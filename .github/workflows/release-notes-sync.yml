name: Release Notes Sync

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Mixer release tag whose committed changelog should be synced"
        required: true
        type: string

concurrency:
  group: release-notes-sync-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Sync existing release body from its versioned changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/sync-release-notes-from-changelog.mjs --repo "$REPO" --tag "$RELEASE_TAG"
